<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema Integrado de Chamadas - EBSERH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        :root { 
            --ebserh-blue: #003865; 
            --ebserh-green: #00a859; 
            --bg: #f0f4f8; 
            --error: #ef4444; 
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: linear-gradient(135deg, #002342 0%, #003865 100%); 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        .login-card { 
            background: white; 
            width: 100%; 
            max-width: 420px; 
            padding: 45px 35px; 
            border-radius: 35px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.25); 
            text-align: center; 
            animation: fadeIn 0.5s ease; 
            box-sizing: border-box;
        }

        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-header .badge {
            background: var(--ebserh-green);
            color: white;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .icon-box { 
            width: 70px; 
            height: 70px; 
            background: #e0f2fe; 
            color: var(--ebserh-blue); 
            border-radius: 22px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 20px; 
        }

        h1 { font-size: 1.6rem; font-weight: 800; color: var(--ebserh-blue); margin: 0 0 5px 0; }
        .sub { color: #64748b; font-size: 0.9rem; margin-bottom: 30px; font-weight: 600; display: block; }
        
        .input-group { margin-bottom: 15px; width: 100%; position: relative; }
        
        input { 
            width: 100%; 
            padding: 18px 20px; 
            border-radius: 18px; 
            border: 2px solid #e2e8f0; 
            font-size: 1rem; 
            font-family: inherit; 
            font-weight: 600; 
            box-sizing: border-box; 
            outline: none; 
            transition: 0.3s; 
            color: var(--ebserh-blue);
        }
        input:focus { border-color: var(--ebserh-green); background: #fff; box-shadow: 0 0 0 3px rgba(0, 168, 89, 0.15); }
        
        .toggle-pass { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; user-select: none; }
        .toggle-pass:hover { color: var(--ebserh-blue); }

        .btn-entrar { 
            width: 100%; 
            padding: 20px; 
            background: var(--ebserh-green); 
            color: white; 
            border: none; 
            border-radius: 18px; 
            font-size: 1.05rem; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px; 
            box-shadow: 0 8px 20px rgba(0, 168, 89, 0.3);
        }
        .btn-entrar:hover { background: #008d4a; transform: translateY(-2px); }
        
        .unidade-grid { display: grid; gap: 12px; margin-top: 20px; }
        .btn-unidade { 
            padding: 20px; 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            border-radius: 18px; 
            cursor: pointer; 
            font-weight: 700; 
            color: var(--ebserh-blue); 
            transition: 0.3s; 
        }
        .btn-unidade:hover { border-color: var(--ebserh-green); color: var(--ebserh-green); background: #f0fdf4; }
        
        .hidden { display: none !important; }
        .signature { margin-top: 30px; font-size: 0.65rem; font-weight: 800; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="login-card" id="card-login">
        <div class="brand-header">
            <span class="badge">EBSERH</span>
        </div>
        <div class="icon-box"><span class="material-symbols-rounded" style="font-size:2rem">health_and_safety</span></div>
        <h1>Hospital Dia</h1>
        <span class="sub">Sistema Chamador de Pacientes</span>
        
        <div class="input-group">
            <input type="text" id="user" placeholder="Usuário">
        </div>
        
        <div class="input-group">
            <input type="password" id="pass" placeholder="Senha">
            <span class="material-symbols-rounded toggle-pass" onclick="toggleSenha()">visibility</span>
        </div>
        
        <button class="btn-entrar" onclick="validar()">Acessar Painel</button>
        <div id="msg-erro" style="color:var(--error); font-size:0.85rem; margin-top:15px; display:none; font-weight: 700;">Usuário ou senha incorretos.</div>
        <div class="signature">Desenvolvido por Lucas Freitas Gomes © 2026</div>
    </div>

    <div class="login-card hidden" id="card-unidades">
        <div class="brand-header">
            <span class="badge">EBSERH</span>
        </div>
        <h1 id="welcome">Olá!</h1>
        <span class="sub">Confirme o acesso ao Hospital Dia</span>
        <div class="unidade-grid" id="grid-unidades"></div>
        <div class="signature">Desenvolvido por Lucas Freitas Gomes © 2026</div>
    </div>

<script>
    const PROFISSIONAIS = {
        "lucas.med": { pass: "@2026", nome: "Drº Lucas Freitas Gomes", cargo: "Médico", multi: true, unidades: [{id:"hd", n:"Hospital Dia EBSERH"}]},
        "lucasfreitas.med": { pass: "@2026", nome: "Drº Lucas Freitas Gomes", cargo: "Médico", multi: true, unidades: [{id:"hd", n:"Hospital Dia EBSERH"}]},
        "medicos.med": { pass: "@2026", nome: "Médico Plantonista", cargo: "Médico", multi: true, unidades: [{id:"hd", n:"Hospital Dia EBSERH"}]},
        "lucas.enf": { pass: "@2026", nome: "Enf. Lucas Freitas", cargo: "Enfermeiro", multi: true, unidades: [{id:"hd", n:"Hospital Dia EBSERH"}]},
        "lucas.tec": { pass: "@2026", nome: "Tec. Lucas Freitas", cargo: "Técnico de Enf.", multi: true, unidades: [{id:"hd", n:"Hospital Dia EBSERH"}]},
        "tv.hd": { pass: "@tv2026", nome: "TV Hospital Dia", cargo: "TV", multi: false, id: "hd", un: "Hospital Dia EBSERH", tipo: "tv" },
        "admin": { pass: "@admin", nome: "Gestor EBSERH", cargo: "Gerência", multi: true, tipo: "gerencia", unidades: [{id:"hd", n:"Hospital Dia EBSERH"}]}
    };

    function toggleSenha() {
        const p = document.getElementById('pass');
        const icon = document.querySelector('.toggle-pass');
        if(p.type === "password") {
            p.type = "text";
            icon.innerText = "visibility_off";
        } else {
            p.type = "password";
            icon.innerText = "visibility";
        }
    }

    function validar() {
        const u = document.getElementById('user').value.toLowerCase().trim();
        const p = document.getElementById('pass').value;
        const user = PROFISSIONAIS[u];

        if(user && user.pass === p) {
            if(user.multi) {
                document.getElementById('card-login').classList.add('hidden');
                document.getElementById('card-unidades').classList.remove('hidden');
                document.getElementById('welcome').innerText = "Olá, " + user.nome.split(' ')[0];
                
                document.getElementById('grid-unidades').innerHTML = user.unidades.map(un => 
                    `<div class="btn-unidade" onclick="entrar('${un.id}','${un.n}','${user.nome}','${user.cargo}', '${user.tipo || "painel"}')">${un.n}</div>`
                ).join('');
            } else { 
                entrar(user.id, user.un, user.nome, user.cargo, user.tipo || "painel"); 
            }
        } else { 
            document.getElementById('msg-erro').style.display="block"; 
        }
    }

    function entrar(id, un, nome, cargo, tipo) {
        sessionStorage.clear();
        sessionStorage.setItem('logado', 'true');
        sessionStorage.setItem('u_id', id); 
        sessionStorage.setItem('u_nome', un);
        sessionStorage.setItem('p_nome', nome); 
        sessionStorage.setItem('p_cargo', cargo);
        
        if(tipo === "gerencia") {
            const escolha = confirm("Deseja abrir a TV do Hospital Dia?\n\n[OK] para abrir a TV\n[Cancelar] para o Painel");
            if(escolha) {
                window.location.href = "tv.html";
            } else {
                window.location.href = "painel.html";
            }
            return;
        }

        if(tipo === "tv") window.location.href = "tv.html";
        else window.location.href = "painel.html";
    }
</script>
</body>
</html>
